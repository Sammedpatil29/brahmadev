<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Brahmadev Constructions</title>

  <base href="/" />

  <meta name="color-scheme" content="light dark" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <!-- Pre-boot theme initialization script to prevent theme flash -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('app_theme') || 'system';
        var isDark = false;
        if (saved === 'dark') {
          isDark = true;
        } else if (saved === 'light') {
          isDark = false;
        } else {
          isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        }
        var root = document.documentElement;
        if (isDark) {
          root.classList.add('ion-palette-dark');
          root.setAttribute('data-bs-theme', 'dark');
          root.setAttribute('data-theme', 'dark');
          root.style.colorScheme = 'dark';
        } else {
          root.classList.remove('ion-palette-dark');
          root.setAttribute('data-bs-theme', 'light');
          root.setAttribute('data-theme', 'light');
          root.style.colorScheme = 'light';
        }
      } catch (e) {}
    })();
  </script>

  <!-- Standard Favicon -->
<link rel="icon" type="image/x-icon" href="assets/favicon.ico" />

<!-- Apple Touch Icon (iOS Home Screen) -->
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />

<!-- Android / Chrome / PWA Standard Icons -->
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="assets/icon-512.png" />

  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes" />
  <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
  <!-- PDF.js for in-app mobile PDF preview rendering -->
  <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>

<body>
  <app-root></app-root>
</body>

</html>
