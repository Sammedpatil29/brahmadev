<ion-content [fullscreen]="true" class="">
  <div class="login-container">
    
    @if (showLogin) {
      <div class="login-card">
        <div class="header-section">
          <div class="logo-placeholder">
            <img style="max-width: none; height: 100px; margin-bottom: 10px" src="assets/Brahmadev Constructions.png" alt="">
          </div>
          <h3 ><b>Brahmadev Constructions</b></h3>
          <p class="subtitle">Enter your credentials to continue</p>
        </div>

        <form class="form-section" (ngSubmit)="login()">
          <div class="input-wrapper">
            <ion-icon name="call-outline"></ion-icon>
            <input 
              type="tel" 
              name="phoneNumber"
              placeholder="Mobile Number" 
              [(ngModel)]="phoneNumber" 
              maxlength="10"
              (keyup.enter)="login()">
          </div>

          <div class="input-wrapper">
            <ion-icon name="lock-closed-outline"></ion-icon>
            <input 
              type="password" 
              name="password"
              placeholder="Password" 
              [(ngModel)]="password"
              (keyup.enter)="login()">
          </div>

          <button 
            type="submit" 
            class="login-button" 
            [disabled]="phoneNumber.length !== 10 || password.length === 0 || isLoading">
            @if (!isLoading) {
              <span>Sign In</span>
            } @else {
              <ion-spinner name="crescent" color="light" class="small-spinner"></ion-spinner>
            }
          </button>
        </form>
      </div>
    } @else {
      <div class="loading-state w-100">
        <img style="width: 100px" src="assets/Untitled design.gif" alt="">
        <!-- <ion-spinner color="primary"></ion-spinner> -->
      </div>
    }

  </div>
</ion-content>
