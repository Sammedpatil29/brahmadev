<ion-app>
  <ion-router-outlet></ion-router-outlet>

  @if (showUpdatedAlert) {
    <div class="ota-relaunch-overlay" (click)="dismissUpdatedAlert()">
      <div class="ota-relaunch-card" (click)="$event.stopPropagation()">
        <div class="ota-content">
          <div class="ota-icon-badge">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
              <polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
          </div>
          <div class="ota-details">
            <div class="ota-title">App Updated{{ updatedVersion ? ' (v' + updatedVersion + ')' : '' }}</div>
            <div class="ota-desc">The app has been updated to the latest version.</div>
          </div>
        </div>
        <div class="ota-actions">
          <button type="button" class="ota-btn ota-btn-restart" (click)="dismissUpdatedAlert()">
            Got It
          </button>
        </div>
      </div>
    </div>
  }

  <div 
    class="socket-indicator" 
    [class.connected]="isSocketConnected" 
    [class.disconnected]="!isSocketConnected">
    <span class="socket-dot"></span>
    <span class="socket-text">{{ isSocketConnected ? 'Looking for live leads' : 'Disconnected' }}</span>
  </div>
</ion-app>
