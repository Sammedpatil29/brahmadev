<ion-app>
  <ion-router-outlet></ion-router-outlet>

  @if (showRelaunchPrompt) {
    <div class="ota-relaunch-overlay">
      <div class="ota-relaunch-card">
        <div class="ota-content">
          <div class="ota-icon-badge">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
            </svg>
          </div>
          <div class="ota-details">
            <div class="ota-title">Update Ready{{ newVersion ? ' (v' + newVersion + ')' : '' }}</div>
            <div class="ota-desc">Restart the app to apply the latest update.</div>
          </div>
        </div>
        <div class="ota-actions">
          <button type="button" class="ota-btn ota-btn-later" (click)="dismissPrompt()">Later</button>
          <button type="button" class="ota-btn ota-btn-restart" (click)="relaunchApp()" [disabled]="isRelaunching">
            {{ isRelaunching ? 'Restarting...' : 'Restart Now' }}
          </button>
        </div>
      </div>
    </div>
  }
</ion-app>
